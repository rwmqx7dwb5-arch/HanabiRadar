# XcodeGen spec. The .xcodeproj is generated (and git-ignored); this file is the
# source of truth. Generate on macOS with: `brew install xcodegen && xcodegen generate`.
name: HanabiRadar

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  knownRegions:
    - en
    - ja
    - Base

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: ja
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.3.0   # 13.4+ requires Xcode 26.2; CI runs Xcode 16.4
  HanabiCore:
    path: HanabiCore
  HanabiCapture:
    path: HanabiCapture

targets:
  HanabiRadar:
    type: application
    platform: iOS
    sources:
      - path: HanabiRadar
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    dependencies:
      - package: HanabiCore
        product: HanabiCore
      - package: HanabiCapture
        product: HanabiCapture
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        # Google's official TEST ids. Release builds MUST override both (xcconfig / fastlane
        # `ADMOB_APP_ID=... ADMOB_INTERSTITIAL_UNIT_ID=...`); never commit production ids (§29).
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_INTERSTITIAL_UNIT_ID: ca-app-pub-3940256099942544/4411468910
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hanabiradar
        PRODUCT_NAME: HanabiRadar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: HanabiRadar/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: HanabiRadar/App/HanabiRadar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""

  HanabiRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HanabiRadarTests
    dependencies:
      - target: HanabiRadar
      - package: HanabiCore
        product: HanabiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hanabiradar.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  HanabiRadarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HanabiRadarUITests
    dependencies:
      - target: HanabiRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hanabiradar.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  HanabiRadar:
    run:
      storeKitConfiguration: HanabiRadar.storekit
    build:
      targets:
        HanabiRadar: all
        HanabiRadarTests: [test]
        HanabiRadarUITests: [test]
    test:
      targets:
        - HanabiRadarTests
        - HanabiRadarUITests
